<h2>Author Report</h2>

<table border="1" style="width: 100%; border-collapse: collapse;">
    <tr>
        <th>Author Name</th>
        <th>Age</th>
        <th>Rating</th>
    </tr>

    {% for(var i = 0; i < data.length; i++) { %}
    <tr>
        <td>{%= data[i].author_name %}</td>
        <td>{%= data[i].age %}</td>
        <td>{%= format_money(data[i].rating) %}</td>
    </tr>
    {% } %}
</table>
